<!DOCTYPE html>
<html lang="fr-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Au bonheur des Anges | Liste PDF</title>
    <link rel="icon" href="logo.jpg">
    <style>
        :root {
            /* Standaard hele lichte transparantie (20% dekkend) gelijk aan index.html */
            --glass-bg: rgba(255, 255, 255, 0.20);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-blur: 16px;
        }

        *, *:before, *:after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: #fbeef7;
            color: #202124;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-header {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            width: 100%;
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }
        .app-header h1 {
            font-size: 16px;
            margin: 0;
            color: #8e44ad;
            font-weight: 600;
        }

        .db-status-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .status-dot.online {
            background-color: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }
        .status-dot.offline {
            background-color: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
        }

        .pdf-container {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 80px;
            box-sizing: border-box;
        }
        embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Witte Floating iOS Navigatiebalk */
        .bottom-nav { 
            position: fixed; 
            bottom: 12px; 
            left: 50%; 
            transform: translateX(-50%);
            width: calc(100% - 24px); 
            max-width: 450px; 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-radius: 28px;
            padding: 6px 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.05);
            z-index: 1000; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .nav-item { 
            flex: 1; 
            text-align: center; 
            padding: 8px 4px; 
            color: #555555; 
            text-decoration: none; 
            font-size: 10px; 
            font-weight: 600; 
            letter-spacing: 0.3px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            border-radius: 18px;
            transition: all 0.2s ease;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.2s;
        }

        .nav-item.active { 
            color: #8e44ad; 
            font-weight: 700; 
            background: rgba(142, 68, 173, 0.12);
        }

        .nav-item.active svg { transform: scale(1.1); }
        .nav-item:active { transform: scale(0.92); opacity: 0.8; }
    </style>
</head>
<body>

<div class="app-header">
    <h1>Au bonheur des Anges</h1>
    <div class="db-status-container">
        <span id="statusDot" class="status-dot offline"></span>
        <span id="statusText" style="color: #e74c3c;">Offline</span>
    </div>
</div>

<div class="pdf-container">
    <embed src="Prix boutique Au bonheur des Anges.  2026.pdf" type="application/pdf">
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>COMMANDER</span>
    </a>
    <a href="list.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>LISTE COMMAND</span>
    </a>
    <a href="listcommand.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"/></svg>
        <span>LISTE PDF</span>
    </a>
    <a href="infoapp.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>INFO</span>
    </a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "JOUW_API_KEY", 
        authDomain: "cloudstockage-b1580.firebaseapp.com",
        databaseURL: "https://cloudstockage-b1580-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "cloudstockage-b1580",
        storageBucket: "cloudstockage-b1580.appspot.com",
        messagingSenderId: "524333606775",
        appId: "JOUW_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        if (snap.val() === true) {
            statusDot.className = "status-dot online";
            statusText.textContent = "en ligne";
            statusText.style.color = "#2ecc71";
        } else {
            statusDot.className = "status-dot offline";
            statusText.textContent = "hors ligne";
            statusText.style.color = "#e74c3c";
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const savedBg = localStorage.getItem("customAppBackground");
        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundAttachment = "fixed";
            document.body.style.backgroundRepeat = "no-repeat";
        }

        const savedOpacity = localStorage.getItem("appGlassOpacity") || "0.20";
        document.documentElement.style.setProperty('--glass-bg', `rgba(255, 255, 255, ${savedOpacity})`);
    });
</script>

</body>
</html>
