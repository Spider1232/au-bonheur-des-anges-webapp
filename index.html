<!DOCTYPE html>
<html lang="fr-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Commander | Au bonheur des Anges |</title>
    <link rel="icon" href="logo.jpg">
    
    <!-- Bibliotheek om HEIC bestanden om te zetten naar JPEG -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        :root {
            /* Standaard transparantie ingesteld op 20% (0.20) */
            --glass-bg: rgba(255, 255, 255, 0.20);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-blur: 16px;
        }

        *, *:before, *:after {
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            background-color: #fbeef7; 
            color: #202124; 
            margin: 0; 
            padding-bottom: 90px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* iOS Transparante Header */
        .app-header { 
            background: var(--glass-bg); 
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            width: 100%; 
            text-align: center; 
            padding: 12px 0; 
            border-bottom: 1px solid var(--glass-border);
            position: sticky; 
            top: 0; 
            z-index: 100; 
            transition: background 0.3s;
        }
        .app-header h1 { font-size: 16px; margin: 0; color: #8e44ad; font-weight: 600; }

        .app-view { width: 100%; max-width: 480px; box-sizing: border-box; padding: 16px; }

        /* iOS Glassmorphism Card */
        .app-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12); 
            width: 100%; 
            box-sizing: border-box; 
            transition: background 0.3s;
        }

        .card-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(142, 68, 173, 0.2);
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .card-header-actions .section-title {
            border-bottom: none;
            margin: 0;
            padding: 0;
        }

        .section-title { 
            font-size: 15px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            color: #8e44ad; 
            font-weight: 700; 
        }

        .btn-settings-icon {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .btn-settings-icon:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.8);
        }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; width: 100%; }
        .form-group label { font-size: 13px; font-weight: 600; color: #4a4a4a; margin-bottom: 6px; }
        
        .form-control { 
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--glass-border); 
            border-radius: 10px; 
            padding: 12px; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.2s; 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .form-control:focus { 
            border-color: #8e44ad; 
            background: rgba(255, 255, 255, 0.85); 
        }

        .form-row { 
            display: flex; 
            gap: 12px; 
            width: 100%;
            box-sizing: border-box;
        }
        .form-row .form-group { 
            flex: 1; 
            min-width: 0;
        }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 8px; cursor: pointer; user-select: none; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: #8e44ad; cursor: pointer; }
        .checkbox-group label { font-size: 14px; font-weight: 600; color: #202124; margin: 0; cursor: pointer; }

        .total-display { 
            background: rgba(142, 68, 173, 0.12); 
            border: 1px solid rgba(142, 68, 173, 0.2);
            border-radius: 10px; 
            padding: 12px; 
            text-align: right; 
            font-size: 15px; 
            font-weight: 700; 
            color: #8e44ad; 
            margin-top: 8px; 
            margin-bottom: 16px; 
            width: 100%;
            box-sizing: border-box;
        }

        .btn-submit { background-color: #8e44ad; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(142, 68, 173, 0.3); transition: all 0.2s; }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        .btn-reset { background-color: rgba(231, 76, 60, 0.85); color: white; border: none; border-radius: 10px; padding: 10px 12px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; transition: background-color 0.2s; }

        .btn-product-toggle { background-color: rgba(142, 68, 173, 0.85); color: white; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 15px; }

        .alert-success { background-color: rgba(46, 204, 113, 0.85); color: white; border-radius: 10px; padding: 12px; font-size: 14px; text-align: center; margin-bottom: 16px; display: none; backdrop-filter: blur(5px); }
        .alert-info { background-color: rgba(52, 152, 219, 0.85); color: white; border-radius: 10px; padding: 10px; font-size: 12px; text-align: center; margin-bottom: 16px; display: none; backdrop-filter: blur(5px); }

        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: var(--glass-bg); 
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            display: flex; 
            justify-content: space-around; 
            border-top: 1px solid var(--glass-border); 
            z-index: 1000; 
            transition: background 0.3s;
        }
        .nav-item { flex: 1; text-align: center; padding: 10px 0; color: #7f8c8d; text-decoration: none; font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .nav-item.active { color: #8e44ad; font-weight: 700; }

        .db-status-container { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; margin-top: 4px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.online { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .status-dot.offline { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px; box-sizing: border-box;
        }
        .modal-container {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px; width: 100%; max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid rgba(0,0,0,0.08); }
        .modal-header h3 { margin: 0; color: #8e44ad; font-size: 16px; font-weight: 700; }
        .btn-close-modal { background: none; border: none; font-size: 24px; color: #7f8c8d; cursor: pointer; }
        #productFrame { width: 100%; height: 80vh; border: none; }

        .slider-container { margin-top: 15px; }
        .slider-container input { width: 100%; accent-color: #8e44ad; cursor: pointer; }

        @media (max-width: 360px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="app-header">
    <h1>Au bonheur des Anges</h1>
    <div class="db-status-container">
        <span id="statusDot" class="status-dot offline"></span>
        <span id="statusText" style="color: #e74c3c;">Offline</span>
    </div>
</div>

<img src="logo.jpg" alt="Logo" style="width:110px; height:110px; margin-top:15px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">

<div class="app-view">
    <div id="alertSuccess" class="alert-success">
        &check; Commande enregistrée avec succès dans le cloud !
    </div>
    <div id="alertRestored" class="alert-info">
        ℹ️ Données en cours de saisie restaurées.
    </div>

    <div class="app-card">
        <div class="card-header-actions">
            <h2 class="section-title">Nouvelle Commande</h2>
            <button type="button" class="btn-settings-icon" onclick="document.getElementById('settingsModal').style.display='flex'" title="Réglages">
                ⚙️
            </button>
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label for="naam">Nom du client *</label>
                <input type="text" id="naam" class="form-control" placeholder="ex: Marie Dupont" required>
            </div>

            <div class="form-group">
                <label for="adres">Adresse de livraison (Optionnel)</label>
                <input type="text" id="adres" class="form-control" placeholder="ex: Rue de la Paix 10, Bruxelles">
            </div>

            <div class="form-group">
                <label for="text">Choisir un produit *</label>
                <select id="text" class="form-control" required onchange="window.updateDefaultPrice()">
                    <option value="" data-price="">-- Chargement des produits... --</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="aantal">Quantité *</label>
                    <input type="number" id="aantal" class="form-control" value="1" min="1" required oninput="calculateTotal()">
                </div>
                <div class="form-group">
                    <label for="prijs">Prix unitaire (€) *</label>
                    <input type="number" step="0.01" id="prijs" class="form-control" placeholder="0.00" required oninput="calculateTotal()">
                </div>
            </div>

            <div class="total-display">
                Total : € <span id="totalAmount">0.00</span>
            </div>

            <div class="form-group">
                <label for="datum">Date de livraison / commande *</label>
                <input type="date" id="datum" class="form-control" required>
            </div>

            <div class="form-group">
                <div class="checkbox-group" onclick="window.toggleCheckbox(event, 'betaald')">
                    <input type="checkbox" id="betaald">
                    <label for="betaald">Commande déjà payée</label>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Enregistrer la commande
            </button>
            
            <button type="button" class="btn-reset" onclick="window.clearFormDraft()">
                🗑️ Effacer le brouillon
            </button>

            <button type="button" class="btn-product-toggle" onclick="window.openProductModal()">
                + Ajoutez des éléments à la liste ou retirez-les-en
            </button>
        </form>
    </div>
</div>

<!-- INSTELLINGEN MODAL (ACHTERGROND & TRANSPARANTIE) -->
<div id="settingsModal" class="modal-overlay">
    <div class="modal-container" style="padding: 20px;">
        <div class="modal-header" style="padding: 0 0 10px 0;">
            <h3>Réglages du style iOS</h3>
            <button class="btn-close-modal" onclick="document.getElementById('settingsModal').style.display='none'">&times;</button>
        </div>
        
        <!-- Transparantie Slider ingesteld op 20% (0.20) -->
        <div class="slider-container">
            <label style="font-size: 13px; font-weight: 600; color: #4a4a4a; display: flex; justify-content: space-between;">
                <span>Transparence des cartes:</span>
                <span id="opacityVal">20%</span>
            </label>
            <input type="range" id="opacitySlider" min="0.05" max="0.95" step="0.05" value="0.20" oninput="window.updateOpacity(this.value)">
        </div>

        <hr style="border: none; border-top: 1px solid rgba(0,0,0,0.1); margin: 15px 0;">

        <div>
            <label style="font-size: 13px; font-weight: 600; color: #4a4a4a; display: block; margin-bottom: 8px;">
                Choisir une image (.jpg, .png, .heic)
            </label>
            <input type="file" id="bgInput" accept="image/jpeg, image/png, image/heic, image/heif" class="form-control">
            <div id="bgLoading" style="display:none; color: #8e44ad; font-size: 12px; margin-top: 6px;">
                Traitement de l'image en cours...
            </div>
        </div>

        <button class="btn-reset" onclick="window.removeCustomBackground()" style="margin-top: 20px;">
            🗑️ Réinitialiser l'arrière-plan
        </button>
    </div>
</div>

<!-- PRODUITEN MODAL -->
<div id="productModal" class="modal-overlay" onclick="window.handleOverlayClick(event)">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Gestion des Produits</h3>
            <button class="btn-close-modal" onclick="window.closeProductModal()">&times;</button>
        </div>
        <iframe id="productFrame" src=""></iframe>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item active">📝<br><span>COMMANDER</span></a>
    <a href="list.html" class="nav-item">📊<br><span>LISTE</span></a>
    <a href="listcommand.html" class="nav-item">📋<br><span>LISTE PDF</span></a>
    <a href="infoapp.html" class="nav-item">ℹ️<br><span>INFO</span></a>
</div>

<!-- Firebase & Script Handler -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "JOUW_API_KEY", 
        authDomain: "cloudstockage-b1580.firebaseapp.com",
        databaseURL: "https://cloudstockage-b1580-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "cloudstockage-b1580",
        storageBucket: "cloudstockage-b1580.appspot.com",
        messagingSenderId: "524333606775",
        appId: "JOUW_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- TRANSPARANTIE FUNCTIE ---
    window.updateOpacity = function(val) {
        document.documentElement.style.setProperty('--glass-bg', `rgba(255, 255, 255, ${val})`);
        document.getElementById('opacityVal').textContent = Math.round(val * 100) + "%";
        localStorage.setItem("appGlassOpacity", val);
    };

    // --- ACHTERGROND & TRANSPARANTIE LADEN ---
    document.addEventListener("DOMContentLoaded", () => {
        const savedBg = localStorage.getItem("customAppBackground");
        if (savedBg) applyBackground(savedBg);

        // Laadt opgeslagen transparantie of valt terug op 20% (0.20)
        const savedOpacity = localStorage.getItem("appGlassOpacity") || "0.20";
        document.getElementById("opacitySlider").value = savedOpacity;
        window.updateOpacity(savedOpacity);
    });

    document.getElementById("bgInput").addEventListener("change", async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const loadingText = document.getElementById("bgLoading");
        loadingText.style.display = "block";

        try {
            let imageBlob = file;
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith(".heic") || fileName.endsWith(".heif") || file.type === "image/heic") {
                const convertedBlob = await heic2any({
                    blob: file,
                    toType: "image/jpeg",
                    quality: 0.7
                });
                imageBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Image = event.target.result;
                try {
                    localStorage.setItem("customAppBackground", base64Image);
                    applyBackground(base64Image);
                    document.getElementById('settingsModal').style.display = 'none';
                } catch (err) {
                    alert("L'image est trop volumineuse pour être stockée.");
                }
                loadingText.style.display = "none";
            };
            reader.readAsDataURL(imageBlob);

        } catch (error) {
            console.error(error);
            alert("Erreur lors du traitement du fichier.");
            loadingText.style.display = "none";
        }
    });

    function applyBackground(dataUrl) {
        document.body.style.backgroundImage = `url('${dataUrl}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.backgroundAttachment = "fixed";
        document.body.style.backgroundRepeat = "no-repeat";
    }

    window.removeCustomBackground = function() {
        localStorage.removeItem("customAppBackground");
        document.body.style.backgroundImage = "none";
        document.body.style.backgroundColor = "#fbeef7";
        document.getElementById('settingsModal').style.display = 'none';
    };

    // --- MODALS ---
    window.openProductModal = function() {
        const frame = document.getElementById("productFrame");
        if (!frame.src || frame.src === "" || frame.src.endsWith("index.html")) {
            frame.src = "add_product.html";
        }
        document.getElementById("productModal").style.display = "flex";
    };

    window.closeProductModal = function() {
        document.getElementById("productModal").style.display = "none";
    };

    window.handleOverlayClick = function(e) {
        if (e.target.id === "productModal") window.closeProductModal();
    };

    // --- DATABASE STATUS LISTENER ---
    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        if (snap.val() === true) {
            statusDot.className = "status-dot online";
            statusText.textContent = "en ligne";
            statusText.style.color = "#2ecc71";
        } else {
            statusDot.className = "status-dot offline";
            statusText.textContent = "hors ligne";
            statusText.style.color = "#e74c3c";
        }
    });

    // --- BROUILLON / DRAFT ---
    const formFieldIds = ['naam', 'adres', 'text', 'aantal', 'prijs', 'datum', 'betaald'];

    function saveDraft() {
        const draft = {
            naam: document.getElementById('naam').value,
            adres: document.getElementById('adres').value,
            text: document.getElementById('text').value,
            aantal: document.getElementById('aantal').value,
            prijs: document.getElementById('prijs').value,
            datum: document.getElementById('datum').value,
            betaald: document.getElementById('betaald').checked
        };
        localStorage.setItem('orderFormDraft', JSON.stringify(draft));
    }

    function restoreDraft() {
        const savedData = localStorage.getItem('orderFormDraft');
        if (!savedData) return;

        try {
            const draft = JSON.parse(savedData);
            let restored = false;

            if (draft.naam) { document.getElementById('naam').value = draft.naam; restored = true; }
            if (draft.adres) { document.getElementById('adres').value = draft.adres; restored = true; }
            if (draft.aantal) { document.getElementById('aantal').value = draft.aantal; restored = true; }
            if (draft.prijs) { document.getElementById('prijs').value = draft.prijs; restored = true; }
            if (draft.datum) { document.getElementById('datum').value = draft.datum; restored = true; }
            if (draft.betaald !== undefined) { document.getElementById('betaald').checked = draft.betaald; }

            if (draft.text) { document.getElementById('text').value = draft.text; }

            window.calculateTotal();

            if (restored) {
                const alertRestored = document.getElementById("alertRestored");
                alertRestored.style.display = "block";
                setTimeout(() => { alertRestored.style.display = "none"; }, 3000);
            }
        } catch (e) {
            console.error(e);
        }
    }

    window.clearFormDraft = function() {
        localStorage.removeItem('orderFormDraft');
        document.getElementById("orderForm").reset();
        document.getElementById("datum").value = new Date().toISOString().split('T')[0];
        document.getElementById("totalAmount").textContent = "0.00";
    };

    formFieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', saveDraft);
            el.addEventListener('change', saveDraft);
        }
    });

    // --- PRODUITEN LADEN ---
    const productsRef = ref(db, 'products');
    onValue(productsRef, (snapshot) => {
        const selectMenu = document.getElementById("text");
        selectMenu.innerHTML = '<option value="" data-price="">-- Sélectionner un produit --</option>';

        if (snapshot.exists()) {
            const data = snapshot.val();
            const categories = {};

            Object.keys(data).forEach(key => {
                const item = data[key];
                const cat = item.categorie || "Autre";
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            Object.keys(categories).sort().forEach(catName => {
                const optGroup = document.createElement("optgroup");
                optGroup.label = catName;

                categories[catName].sort((a,b) => (a.naam || "").localeCompare(b.naam || ""));

                categories[catName].forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.naam;
                    option.setAttribute("data-price", item.prijs);
                    const formattedPrice = parseFloat(item.prijs || 0).toFixed(2).replace('.', ',');
                    option.textContent = `${item.naam} - ${formattedPrice} €`;
                    optGroup.appendChild(option);
                });

                selectMenu.appendChild(optGroup);
            });

            restoreDraft();
        } else {
            selectMenu.innerHTML = '<option value="" data-price="">-- Aucun produit trouvé --</option>';
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        if (!localStorage.getItem('orderFormDraft')) {
            document.getElementById("datum").value = new Date().toISOString().split('T')[0];
        }
    });

    window.updateDefaultPrice = function() {
        const selectElement = document.getElementById("text");
        const selectedOption = selectElement.options[selectElement.selectedIndex];
        const defaultPrice = selectedOption.getAttribute("data-price");
        
        if (defaultPrice !== null && defaultPrice !== "") {
            document.getElementById("prijs").value = defaultPrice;
            window.calculateTotal();
        }
        saveDraft();
    };

    window.calculateTotal = function() {
        const aantal = parseInt(document.getElementById("aantal").value) || 0;
        const prijs = parseFloat(document.getElementById("prijs").value) || 0;
        document.getElementById("totalAmount").textContent = (aantal * prijs).toFixed(2);
    };

    window.toggleCheckbox = function(e, id) {
        const checkbox = document.getElementById(id);
        if (e && e.target !== checkbox) checkbox.checked = !checkbox.checked;
        saveDraft();
    };

    // FORM SUBMIT
    document.getElementById("orderForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const text = document.getElementById("text").value;
        if (!text) {
            alert("Veuillez choisir un produit dans la liste.");
            return;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Enregistrement...";

        const newOrder = {
            naam: document.getElementById("naam").value.trim(),
            adres: document.getElementById("adres").value.trim(),
            text: text,
            aantal: parseInt(document.getElementById("aantal").value) || 1,
            prijs: parseFloat(document.getElementById("prijs").value) || 0,
            datum: document.getElementById("datum").value,
            betaald: document.getElementById("betaald").checked,
            terugbetaald: false,
            timestamp: Date.now()
        };

        try {
            await set(push(ref(db, 'items')), newOrder);

            const alertBox = document.getElementById("alertSuccess");
            alertBox.style.display = "block";
            setTimeout(() => { alertBox.style.display = "none"; }, 4000);

            window.clearFormDraft();
        } catch (error) {
            alert("Erreur lors de l'enregistrement : " + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Enregistrer la commande";
        }
    });
</script>
</body>
</html>
